# Flickr8k automatic train/validation split for one NVIDIA L40.
#
# Launch:
#   torchrun --standalone --nproc_per_node=1 \
#     train_ditic_ddp.py \
#     --config train_ditic_example.yaml

data:
  # Flickr8k图像目录
  image_root: /hdd/u202411103070/projects/datasets/flickr8k/images/Flicker8k_Dataset

  # Flickr8k caption标注文件
  annotation_file: /hdd/u202411103070/projects/datasets/flickr8k/texts/Flickr8k.token.txt

  # 未提供官方split文件时，按照图像身份自动划分
  validation_ratio: 0.125
  split_seed: 903

  # 每张训练图片使用全部5条caption
  train_caption_indices: [0]

  # 当前为null，使用上面的validation_ratio自动划分
  train_split_file: null
  valid_split_file: null

  patch_size: [256, 256]
  num_workers: 8

model:
  dit_path: /hdd/u202411103070/projects/img_research/all_checkpoints/SANA

  elic_path: /hdd/u202411103070/projects/img_research/all_checkpoints/ELIC/elic_official.pth

  # 本地CLIP模型目录
  clip_text_model: /hdd/u202411103070/projects/img_research/all_checkpoints/CLIP

  # 使用CLIP最终投影后的文本embedding
  clip_text_output: projected

  clip_max_length: 77

train:
  output_dir: /hdd/u202411103070/projects/img_research/mini_dit_codec/train_output/checkpoints

  # 建议smoke test单独用一个实验名，避免覆盖正式训练日志
  exp_name: flickr8k_bz16_cap1_step3000

  global_seed: 903

  global_batch_size: 16
  valid_global_batch_size: 1

  # 新版train()读取这个字段
  enable_validation: true

  # Smoke test配置
  max_steps: 3000
  log_every: 10
  valid_every: 200
  ckpt_every: 1000

  ema_decay: 0.999
  resume: null

optimizer:
  lr: 1.0e-4
  aux_lr: 1.0e-3
  beta2: 0.999
  weight_decay: 0.0
  max_grad_norm: 4.0

  # 200步测试期间不会触发，正式训练时保留
  step_lr: [50000, 80000, 90000]
  step_gamma: [0.5, 0.2, 0.1]

loss:
  lambda_rate: 0.5
  lambda_mse: 1.0

  lambda_lpips: 1.0
  lpips_net: alex

  lambda_dists: 1.0

  lambda_distill: 1.0

  # 训练阶段使用caption做CLIP对齐
  # 验证阶段自动跳过condition loss
  lambda_cond: 1.0

